name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    name: Apply migrations to a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Starts a local Postgres with Supabase's auth and storage schemas and applies every migration in order;
      # fails if any migration errors.
      - run: supabase db start
      # Permission tests (pgTAP) in supabase/tests.
      - run: supabase test db
