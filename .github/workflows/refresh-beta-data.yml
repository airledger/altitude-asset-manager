name: Refresh beta data

# Copies the live app's records and logins into BETA, swapping customer emails and phone numbers for dummies.
# Reads production inside a read-only transaction; only writes to beta. Run by hand from the Actions tab.
# Photos and PDFs aren't copied (beta shows placeholders for them).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: beta-database

env:
  PROD_REF: txtdydgflwvzxjrfdbly
  BETA_REF: besbuksxoyxkvaynzvax

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Find connection addresses
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          BETA_PASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN PROD_PASSWORD BETA_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          url() { # $1 project ref, $2 password: link, then read the pooler address the CLI saved
            SUPABASE_DB_PASSWORD="$2" supabase link --project-ref "$1" >/dev/null
            cat supabase/.temp/pooler-url
          }
          echo "PROD_URL=$(url "$PROD_REF" "$PROD_PASSWORD")" >> "$GITHUB_ENV"
          echo "BETA_URL=$(url "$BETA_REF" "$BETA_PASSWORD")" >> "$GITHUB_ENV"
      - name: Read production (read-only)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          case "$PROD_URL" in *"$PROD_REF"*) ;; *) echo "::error::Production address doesn't match"; exit 1;; esac
          scripts/beta/export-production.sh "$PROD_URL" "$RUNNER_TEMP/copy"
      - name: Replace beta data and scrub customer contacts
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          # Belt and braces: the import deletes everything first, so refuse anything but the beta project.
          case "$BETA_URL" in *"$BETA_REF"*) ;; *) echo "::error::Beta address doesn't match"; exit 1;; esac
          case "$BETA_URL" in *"$PROD_REF"*) echo "::error::Refusing to import into production"; exit 1;; esac
          cd "$RUNNER_TEMP/copy"
          psql "$BETA_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/scripts/beta/import-to-beta.sql"
      - name: Delete the copied files
        if: always()
        run: rm -rf "$RUNNER_TEMP/copy"
