name: Refresh beta data

# Copies the live app's records and logins into BETA, swapping customer emails and phone numbers for dummies.
# Reads production inside a read-only transaction; only writes to beta. Run by hand from the Actions tab.
# Photos and PDFs aren't copied (beta shows placeholders for them).
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Also add made-up test clients, installs, units and jobs (scripts/beta/demo-data.sql)
        type: boolean
        default: true

permissions:
  contents: read

concurrency: beta-database

env:
  PROD_REF: txtdydgflwvzxjrfdbly
  BETA_REF: besbuksxoyxkvaynzvax

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Find connection addresses
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          BETA_PASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN PROD_PASSWORD BETA_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          # Beta: link with the access token and read the pooler address the CLI saves.
          SUPABASE_DB_PASSWORD="$BETA_PASSWORD" supabase link --project-ref "$BETA_REF" >/dev/null
          BETA_URL=$(cat supabase/.temp/pooler-url)
          # Production's session pooler (from the live project's Connect → Session pooler; no password in it).
          # The access token can't see the live project, which is under another Supabase login.
          PROD_URL="postgresql://postgres.$PROD_REF@aws-0-eu-north-1.pooler.supabase.com:5432/postgres"
          if ! err=$(PGPASSWORD="$PROD_PASSWORD" psql "$PROD_URL" -X -q -t -c "select 1" 2>&1 >/dev/null); then
            echo "$(echo "$err" | tail -1)"   # psql errors never include the password
            PROD_URL=""
          fi
          [ -n "$PROD_URL" ] || { echo "::error::Couldn't connect to production. Check SUPABASE_PROD_DB_PASSWORD."; exit 1; }
          [ -n "$BETA_URL" ] || { echo "::error::Couldn't find the beta database address."; exit 1; }
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "BETA_URL=$BETA_URL" >> "$GITHUB_ENV"
      - name: Read production (read-only)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          case "$PROD_URL" in *"$PROD_REF"*) ;; *) echo "::error::Production address doesn't match"; exit 1;; esac
          scripts/beta/export-production.sh "$PROD_URL" "$RUNNER_TEMP/copy"
      - name: Replace beta data and scrub customer contacts
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          # Belt and braces: the import deletes everything first, so refuse anything but the beta project.
          case "$BETA_URL" in *"$BETA_REF"*) ;; *) echo "::error::Beta address doesn't match"; exit 1;; esac
          case "$BETA_URL" in *"$PROD_REF"*) echo "::error::Refusing to import into production"; exit 1;; esac
          cd "$RUNNER_TEMP/copy"
          psql "$BETA_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/scripts/beta/import-to-beta.sql"
      - name: Add made-up test records
        if: inputs.demo
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          psql "$BETA_URL" -X -v ON_ERROR_STOP=1 -f scripts/beta/demo-data.sql
          # Also into the rebuild's typed tables, once their migration has reached beta.
          if [ "$(psql "$BETA_URL" -X -Atc "select to_regclass('public.clients') is not null")" = t ]; then
            psql "$BETA_URL" -X -v ON_ERROR_STOP=1 -f scripts/beta/demo-tables.sql
          fi
      - name: Delete the copied files
        if: always()
        run: rm -rf "$RUNNER_TEMP/copy"
