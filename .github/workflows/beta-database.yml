name: Update beta database

# Applies new migrations to the beta (staging) Supabase project after they merge to main.
# Never touches production. Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_BETA_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: beta-database

env:
  # Beta project ref (public, like the production one in config.js): https://besbuksxoyxkvaynzvax.supabase.co
  SUPABASE_PROJECT_REF: besbuksxoyxkvaynzvax

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check the beta project is set up
        id: ready
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PASSWORD" ]; then
            echo "Beta isn't connected yet (missing SUPABASE_ACCESS_TOKEN or SUPABASE_BETA_DB_PASSWORD secret). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - if: steps.ready.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_BETA_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all
