# Builds the phone apps (apps/mobile) from the beta web app on every change.
# Android: an installable test app (debug APK). Download "air-ledger-android-beta" from the run's Artifacts.
# iPhone: a simulator build with no signing, to prove it still builds (started by hand). Putting it on a real iPhone needs
# TestFlight (Apple Developer account) or Xcode on a Mac; see apps/mobile/README.md.
name: Phone apps

on:
  pull_request:
    paths: ["apps/**", "packages/**", "package-lock.json", ".github/workflows/phone-apps.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "package-lock.json", ".github/workflows/phone-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:beta -w @airledger/mobile -- android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: air-ledger-android-beta
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  # GitHub hasn't been giving this repository Mac machines, so the iPhone check only runs when started by hand
  # (Actions → Phone apps → Run workflow). The real iPhone build is done in Xcode on a Mac (see apps/mobile/README.md).
  ios:
    name: iPhone build check
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:beta -w @airledger/mobile -- ios
      # Capacitor 8 needs Xcode 26; use the newest Xcode on the machine.
      - run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - run: >
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build | tail -50; exit "${PIPESTATUS[0]}"
        shell: bash
