<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altitude Climate — Asset Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<meta name="theme-color" content="#0a6fb8">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#f3f6f9;--card:#fff;--ink:#0f1e2e;--muted:#5b6b7c;--line:#dfe6ee;
  --brand:#0a6fb8;--brand-d:#08578f;--brand-l:#e6f1fa;--accent:#13a89e;
  --red:#c8372d;--red-l:#fdecea;--amber:#b86e00;--amber-l:#fff4e0;--green:#1d7f4e;--green-l:#e5f5ec;
  --r:12px;--sh:0 1px 2px rgba(15,30,46,.06),0 2px 8px rgba(15,30,46,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-decoration:none}
header.top{background:linear-gradient(120deg,#0a3d66,#0a6fb8 60%,#13a89e);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20}
.brandrow{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.brandrow svg{flex:none}
.brandrow h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brandrow small{display:block;font-weight:500;opacity:.8;font-size:12px}
.brandrow .sp{flex:1}
.scanbtn{background:#fff;color:var(--brand-d);border:0;border-radius:999px;padding:9px 14px;font:600 14px Inter,sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#fff;opacity:.78;padding:9px 12px 11px;white-space:nowrap;font-weight:500;font-size:14px;border-bottom:3px solid transparent}
nav.tabs a.on{opacity:1;border-bottom-color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.banner{background:var(--amber-l);color:#6b4100;border:1px solid #f2d39b;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:13.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
h1.pg{font-size:21px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;cursor:pointer}
.kpi b{display:block;font-size:24px;font-weight:700}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.red b{color:var(--red)}.kpi.amber b{color:var(--amber)}.kpi.green b{color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c6d4}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.danger{color:var(--red);border-color:#f0c4c0}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--muted);font-size:13px}
.item.click{cursor:pointer}
.item.click:hover .t{color:var(--brand)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--brand-l);color:var(--brand-d);white-space:nowrap}
.pill.red{background:var(--red-l);color:var(--red)}.pill.amber{background:var(--amber-l);color:var(--amber)}.pill.green{background:var(--green-l);color:var(--green)}.pill.grey{background:#eef1f4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:500;word-break:break-word}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.tw{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:15px Inter,sans-serif;margin-bottom:12px;background:#fff}
.seg{display:inline-flex;background:#e8eef4;border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:500 13.5px Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.uid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;letter-spacing:.3px}
.hero{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero .qr{width:140px;height:140px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;flex:none}
.hero .qr svg{width:100%;height:100%}
.fgas{background:#f1f8fd;border:1px solid #cfe3f3;border-radius:10px;padding:10px 12px;font-size:13.5px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 20px}
@media(min-width:700px){.md{border-radius:16px}}
.md h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center}
.md h3 .x{margin-left:auto;border:0;background:#eef1f4;border-radius:999px;width:32px;height:32px;font-size:18px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .full{grid-column:1/-1}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=email],.f input[type=tel],.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font:15px Inter,sans-serif;background:#fff;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.f.cb label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:20px}
.f .hint{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sec{font-weight:600;font-size:14px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.chk label{display:flex;gap:6px;align-items:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1e2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}#toast.err{background:var(--red)}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.note{font-size:13px;color:var(--muted)}
.lines input{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:7px;font:14px Inter,sans-serif}
.lines td{padding:4px 3px}
.tot{margin-top:10px;text-align:right;font-size:14px}
.tot b{font-size:17px}
.rep{border-top:1px solid var(--line);padding:11px 0}.rep:first-child{border-top:0}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rh .sp{flex:1}
.rt{white-space:pre-line;margin-top:6px;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img,.thumbs .ph{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:#eef1f4}
.thumbs .tw2{position:relative}.thumbs .tw2 button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:999px;border:0;background:var(--red);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.ph{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.newsticker{border:2px dashed var(--brand);background:var(--brand-l)}
pre.copy{white-space:pre-wrap;background:#f6f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font:13.5px/1.45 Inter,sans-serif;margin:0}
</style>
</head>
<body>
<header class="top">
  <div class="brandrow">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="rgba(255,255,255,.16)"/><path d="M5 25 L13 12 L18 19 L21 15 L29 25 Z" fill="#fff"/><g stroke="#bfefff" stroke-width="1.6" stroke-linecap="round"><path d="M24 5v8M20.5 7l7 4M27.5 7l-7 4"/></g></svg>
    <div><h1>Altitude Climate</h1><small>Asset Manager</small></div>
    <div class="sp"></div>
    <button class="scanbtn" id="scanBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>Scan</button>
  </div>
  <nav class="tabs" id="nav"></nav>
</header>
<main id="app"><div class="loading">Loading your assets…</div></main>
<input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= constants ================= */
const APP_URL_DEFAULT = location.origin+location.pathname;
const REFRIGERANTS = {"R32":675,"R410A":2088,"R454B":466,"R452B":698,"R290":3,"R407C":1774,"R134a":1430,"R513A":631,"R1234ze":7,"R744":1,"R22":1810};
const SERVICE_TYPES = ["Annual service","Service + repair"];
const JOB_TYPES = ["Annual service","Service + repair","Leak check","Repair / breakdown","Installation","Commissioning","Survey"];
const INDOOR_TYPES = ["Wall mounted","Cassette","Ducted","Floor console","Ceiling suspended","Other"];
const APPLIES = {visit:"Per visit",indoor:"Per indoor unit",outdoor:"Per outdoor unit",wall:"Per wall-mounted unit",cassette:"Per cassette",ducted:"Per ducted unit",console:"Per floor console",pump:"Per condensate pump",filter:"Per replaceable filter unit",remote:"Per wireless remote"};
const WHEN = {service:"Services only",leak:"When leak check due",any:"Every job"};
const DEFAULTS = {
  businessName:"Altitude Climate", tradingAs:"Altitude Electrical", phone:"", email:"lewis@altitudeelectrical.co.uk", address:"",
  engineer:"Lewis", fgasCert:"", appUrl:"",
  defaultInterval:12, reminderLeadDays:30, chaseAfterDays:14, warrantyYears:5,
  labourFirst:95, labourAdditional:45, labourHourly:60, leakCheckCharge:40, refrigerantPerKg:60, calloutCharge:75,
  vatRegistered:true, invoicePrefix:"AC-", nextInvoiceNo:1001, paymentDays:14, accountCode:"200",
  taxType:"20% (VAT on Income)", trackingName:"", trackingOption:"",
  emailSubject:"Your air conditioning service is due – {site}",
  emailBody:"Hi {contact},\n\nOur records show the air conditioning at {site} ({units}) is due its annual service on {dueDate}.\n\nRegular servicing keeps the system running efficiently, keeps the air clean and keeps your manufacturer's warranty valid.\n\nJust reply to this email or call us on {phone} and we'll book a time that suits you.\n\nKind regards,\n{engineer}\n{business}",
  smsBody:"Hi {contact}, it's {engineer} from {business}. Your air con at {site} is due its annual service ({dueDate}). Reply or call {phone} to book a time. Thanks!"
};

/* ================= state ================= */
const COLS = ["clients","systems","units","jobs","materials","invoices","reports"];
const S = {clients:[],systems:[],units:[],jobs:[],materials:[],invoices:[],reports:[],settings:{}};
const loaded = new Set();
let db = null, downloads = null, assets = null, memoryMode = false;
const photoCache = {};
let scanMode = null;
const INSTALL_TYPES = ["Installation","Commissioning"];
const isInstall = j => !!j && INSTALL_TYPES.includes(j.type);
const REPORT_KINDS = ["Service report","Install / commissioning report","Site note","Defect / remedial","Customer request","Photos"];
const STICKER_RE = /^AC-[A-Z0-9]{5}$/;
const ui = {assetQ:"", assetView:"systems", jobView:"booked", invView:"draft", orderDays:14, clientQ:"", sel:new Set()};

/* ================= utilities ================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rid(n=10){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const b=new Uint32Array(n);crypto.getRandomValues(b);for(const x of b)s+=a[x%a.length];return s}
function unitId(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const b=new Uint32Array(5);crypto.getRandomValues(b);for(const x of b)s+=a[x%a.length];return "AC-"+s}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function addMonths(iso,n){if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+Number(n),1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}
function addDays(iso,n){const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+Number(n));return t.toISOString().slice(0,10)}
function daysUntil(iso){return Math.round((Date.parse(iso+"T00:00:00Z")-Date.parse(todayISO()+"T00:00:00Z"))/86400000)}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){if(!iso)return "—";const [y,m,d]=iso.split("-").map(Number);return d+" "+MON[m-1]+" "+y}
function fmtUK(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y}
function money(n){return "£"+(Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}
function r2(n){return Math.round((Number(n)||0)*100)/100}
function num(n,dp=2){return (Number(n)||0).toLocaleString("en-GB",{maximumFractionDigits:dp})}
function byDateDesc(a,b){return (b.date||"").localeCompare(a.date||"")||(b.time||"").localeCompare(a.time||"")}
function byDateAsc(a,b){return (a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"")}
function clone(o){return JSON.parse(JSON.stringify(o??{}))}
function set(){return Object.assign({},DEFAULTS,S.settings||{})}
function toast(msg,kind){const t=$("#toast");t.textContent=msg;t.className="on"+(kind==="err"?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="",kind==="err"?4500:2600)}
function fill(tpl,map){return String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=>map[k]!=null?map[k]:m)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Couldn't copy – select the text and copy manually","err")}}

/* ================= lookups ================= */
const client = id=>S.clients.find(x=>x.id===id);
const system = id=>S.systems.find(x=>x.id===id);
const unit = id=>S.units.find(x=>x.id===id);
const job = id=>S.jobs.find(x=>x.id===id);
const invoice = id=>S.invoices.find(x=>x.id===id);
const unitsOf = sid=>S.units.filter(u=>u.systemId===sid).sort((a,b)=>(a.role===b.role?0:a.role==="outdoor"?-1:1)||(a.location||"").localeCompare(b.location||""));
const systemsOf = cid=>S.systems.filter(s=>s.clientId===cid);
const jobsOf = sid=>S.jobs.filter(j=>j.systemId===sid);
function unitLabel(u){return u.role==="outdoor"?"Outdoor unit":(u.indoorType||"Indoor unit")}
function unitsSummary(sid){const us=unitsOf(sid);const i=us.filter(u=>u.role==="indoor").length,o=us.filter(u=>u.role==="outdoor").length;const p=[];if(o)p.push(o+" outdoor");if(i)p.push(i+" indoor");return p.join(" + ")||"no units yet"}
function siteShort(s){return (s.siteAddress||"").split(/\n|,/)[0]+(s.sitePostcode?" "+s.sitePostcode:"")}

/* ================= F-gas & service logic ================= */
function fgas(sys){
  const gwp = REFRIGERANTS[sys.refrigerant] ?? (Number(sys.gwp)||0);
  const kg = (Number(sys.factoryChargeKg)||0)+(Number(sys.addedChargeKg)||0);
  const t = kg*gwp/1000;
  const thr = sys.hermetic?10:5;
  let months = 0;
  if(t>=500) months=3; else if(t>=50) months=6; else if(t>=thr) months=12;
  if(months && sys.leakDetection) months*=2;
  return {gwp,kg,t,months,required:months>0,thr};
}
function sysInfo(sys){
  const st=set();
  const all = jobsOf(sys.id);
  const done = all.filter(j=>j.status==="completed").sort(byDateDesc);
  const lastSvcJob = done.find(j=>SERVICE_TYPES.includes(j.type));
  const lastSvc = lastSvcJob?lastSvcJob.date:null;
  const interval = Number(sys.serviceIntervalMonths)||Number(st.defaultInterval)||12;
  const base = lastSvc||sys.installDate;
  const nextDue = base?addMonths(base,interval):null;
  const f = fgas(sys);
  const lastLeakJob = done.find(j=>j.leakCheck&&j.leakCheck.performed);
  const lastLeak = lastLeakJob?lastLeakJob.date:null;
  const nextLeak = f.required?addMonths(lastLeak||sys.installDate,f.months):null;
  const upcoming = all.filter(j=>j.status==="booked").sort(byDateAsc);
  const booked = upcoming.find(j=>SERVICE_TYPES.includes(j.type));
  const cycleStart = lastSvc||sys.installDate||"";
  const contacts = (sys.contactLog||[]).filter(c=>c.date>=cycleStart && c.date>addDays(nextDue||todayISO(),-120));
  const lastContact = contacts.length?contacts[contacts.length-1]:null;
  const wy = sys.warrantyYears===""||sys.warrantyYears==null?Number(st.warrantyYears):Number(sys.warrantyYears);
  const warrantyEnd = sys.installDate&&wy?addMonths(sys.installDate,12*wy):null;
  return {lastSvc,nextDue,interval,f,lastLeak,nextLeak,upcoming,booked,lastContact,warrantyEnd,done};
}
function dueStatus(sys,info){
  info=info||sysInfo(sys);
  const st=set();
  if(sys.inactive) return {key:"off",label:"Inactive",cls:"grey"};
  if(!info.nextDue) return {key:"none",label:"No install date",cls:"grey"};
  const d=daysUntil(info.nextDue);
  if(info.booked) return {key:"booked",label:"Booked "+fmtDate(info.booked.date),cls:"green"};
  if(d>Number(st.reminderLeadDays)) return {key:"ok",label:"Due "+fmtDate(info.nextDue),cls:"grey"};
  if(info.lastContact){
    const since=-daysUntil(info.lastContact.date);
    if(since>=Number(st.chaseAfterDays)) return {key:"chase",label:"Chase – contacted "+since+"d ago",cls:"amber",act:true};
    return {key:"contacted",label:"Contacted "+fmtDate(info.lastContact.date),cls:"",act:false};
  }
  if(d<0) return {key:"overdue",label:"Overdue "+(-d)+"d – contact",cls:"red",act:true};
  return {key:"due",label:(d===0?"Due today":"Due in "+d+"d")+" – contact",cls:"amber",act:true};
}

/* ================= materials ================= */
function countFor(applies,us){
  const ind=us.filter(u=>u.role==="indoor");
  switch(applies){
    case "visit":return 1;
    case "indoor":return ind.length;
    case "outdoor":return us.filter(u=>u.role==="outdoor").length;
    case "wall":return ind.filter(u=>u.indoorType==="Wall mounted").length;
    case "cassette":return ind.filter(u=>u.indoorType==="Cassette").length;
    case "ducted":return ind.filter(u=>u.indoorType==="Ducted").length;
    case "console":return ind.filter(u=>u.indoorType==="Floor console").length;
    case "pump":return us.filter(u=>u.condensatePump).length;
    case "filter":return ind.filter(u=>u.filterType==="Replaceable").length;
    case "remote":return ind.filter(u=>(u.controller||"Wireless remote")==="Wireless remote").length;
  }
  return 0;
}
function materialsFor(j){
  const sys=system(j.systemId); if(!sys) return [];
  const us=unitsOf(sys.id); const info=sysInfo(sys);
  const isService=SERVICE_TYPES.includes(j.type);
  const leakDue = j.type==="Leak check" || (info.f.required && info.nextLeak && info.nextLeak<=addDays(j.date||todayISO(),31));
  const out=[];
  for(const m of S.materials){
    if(m.active===false) continue;
    const w=m.when||"service";
    if(w==="service"&&!isService) continue;
    if(w==="leak"&&!leakDue) continue;
    const c=countFor(m.appliesTo||"visit",us); if(!c) continue;
    const raw=c*(Number(m.qtyPer)||1);
    out.push({id:m.id,name:m.name,sku:m.sku||"",supplier:m.supplier||"Unassigned",raw,qty:Math.ceil(raw-1e-9),cost:Number(m.cost)||0,sell:Number(m.sell)||0,chargeable:!!m.chargeable});
  }
  return out;
}
function jobMaterials(j){return (j.materialsOrdered&&j.materialsSnapshot)||(j.status==="completed"&&j.materialsUsed)||materialsFor(j)}

function appUrl(){return (set().appUrl||APP_URL_DEFAULT||"").replace(/#.*$/,"")}
function unitLink(id){const b=appUrl();return b?b+"#u-"+id:id}
function qrSvg(text){
  if(typeof window.qrcode!=="function") return '<svg viewBox="0 0 10 10"><text x="5" y="5.5" font-size="1.4" text-anchor="middle">QR unavailable</text></svg>';
  const q=qrcode(0,"M"); q.addData(text); q.make();
  const n=q.getModuleCount(), m=2, sz=n+m*2; let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function parseScan(text){
  text=String(text||"").trim();
  let m=text.match(/#u-([A-Za-z0-9-]+)/); if(m) return m[1].toUpperCase();
  m=text.match(/\bAC-?([A-Z0-9]{5})\b/i); if(m) return "AC-"+m[1].toUpperCase();
  return null;
}

/* ================= data layer ================= */
function memDb(){
  const store={}; const subs=[];
  const colOf=p=>p.split("/").slice(0,-1).join("/");
  function emit(){for(const s of subs)s()}
  function docRef(path){return{id:path.split("/").pop(),path,
    async get(){const v=store[path];return{id:this.id,exists:!!v,data:()=>v&&clone(v),metadata:{}}},
    async set(d){store[path]=clone(d);emit()},
    async update(d){if(!store[path])throw{code:"invalid_argument"};Object.assign(store[path],clone(d));emit()},
    async delete(){delete store[path];emit()},
    onSnapshot(cb){const f=()=>{const v=store[path];cb({id:path.split("/").pop(),exists:!!v,data:()=>v&&clone(v),metadata:{}})};subs.push(f);setTimeout(f,0);return()=>{}}}}
  function colRef(path){return{path,doc:(id)=>docRef(path+"/"+(id||rid(20))),
    onSnapshot(cb){const f=()=>{const docs=Object.keys(store).filter(k=>colOf(k)===path).map(k=>({id:k.split("/").pop(),exists:true,data:()=>clone(store[k]),metadata:{}}));cb({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.push(f);setTimeout(f,0);return()=>{}},
    async get(){return{docs:Object.keys(store).filter(k=>colOf(k)===path).map(k=>({id:k.split("/").pop(),exists:true,data:()=>clone(store[k])}))}}}}
  return{doc:docRef,collection:colRef,_store:store};
}
let sb=null;
function sbDb(){
  const store={}; const subs=[];
  const colOf=p=>p.split("/").slice(0,-1).join("/");
  const split=p=>{const i=p.lastIndexOf("/");return [p.slice(0,i),p.slice(i+1)]};
  let t=0; function emit(){clearTimeout(t);t=setTimeout(()=>{for(const s of subs)s()},0)}
  function docRef(path){const [col,id]=split(path);return{id,path,
    async get(){const v=store[path];return{id,exists:!!v,data:()=>v&&clone(v),metadata:{}}},
    async set(d){const {error}=await sb.from("docs").upsert({col,id,data:d});if(error)throw error;store[path]=clone(d);emit()},
    async update(d){if(!store[path])throw{code:"invalid_argument"};return this.set(Object.assign(clone(store[path]),d))},
    async delete(){const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error;delete store[path];emit()},
    onSnapshot(cb){const f=()=>{const v=store[path];cb({id,exists:!!v,data:()=>v&&clone(v),metadata:{}})};subs.push(f);setTimeout(f,0);return()=>{}}}}
  function colRef(path){return{path,doc:(id)=>docRef(path+"/"+(id||rid(20))),
    onSnapshot(cb){const f=()=>{const docs=Object.keys(store).filter(k=>colOf(k)===path).map(k=>({id:k.split("/").pop(),exists:true,data:()=>clone(store[k]),metadata:{}}));cb({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.push(f);setTimeout(f,0);return()=>{}},
    async get(){return{docs:Object.keys(store).filter(k=>colOf(k)===path).map(k=>({id:k.split("/").pop(),exists:true,data:()=>clone(store[k])}))}}}}
  async function load(){
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from("docs").select("col,id,data").range(from,from+999);
      if(error)throw error;
      for(const r of data)store[r.col+"/"+r.id]=r.data;
      if(data.length<1000)break;
    }
    sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      if(p.eventType==="DELETE"){const o=p.old||{};if(o.col)delete store[o.col+"/"+o.id]}
      else{const n=p.new;store[n.col+"/"+n.id]=n.data}
      emit();
    }).subscribe();
  }
  return{doc:docRef,collection:colRef,load,_store:store};
}
const sbAssets={
  async upload(blob,{type}){const id=rid(20)+"."+(type.split("/")[1]||"jpg");const {error}=await sb.storage.from("photos").upload(id,blob,{contentType:type});if(error)throw error;return{id,url:URL.createObjectURL(blob)}},
  async delete(id){await sb.storage.from("photos").remove([id])}
};
const sbDownloads={
  async save({filename,data}){
    const type=/\.csv$/i.test(filename)?"text/csv":/\.json$/i.test(filename)?"application/json":/\.ics$/i.test(filename)?"text/calendar":"text/plain";
    const url=URL.createObjectURL(new Blob([data],{type}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
};
async function restoreBackup(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let b;try{b=JSON.parse(await f.text())}catch(e){toast("That file isn't a valid backup","err");return}
    const rows=[];
    for(const c of COLS)for(const d of (b[c]||[])){const body=clone(d);const id=body.id;delete body.id;if(id)rows.push({col:c,id,data:body})}
    if(b.settings&&Object.keys(b.settings).length){const st=clone(b.settings);if(/claude\.ai/.test(st.appUrl||""))st.appUrl="";rows.push({col:"config",id:"settings",data:st})}
    if(!rows.length){toast("No records found in that file","err");return}
    if(!await confirmBox("Import "+rows.length+" records from this backup? Records with the same ID will be overwritten."))return;
    for(let i=0;i<rows.length;i+=200){const {error}=await sb.from("docs").upsert(rows.slice(i,i+200));if(error){toast("Import failed: "+error.message,"err");return}}
    for(const r of rows)db._store[r.col+"/"+r.id]=r.data;
    location.reload();
  };
  inp.click();
}

async function put(col,id,data){
  const body=clone(data); delete body.id;
  try{await db.collection(col).doc(id).set(body);return true}
  catch(e){toast("Save failed: "+(e&&(e.message||e.code)||e),"err");return false}
}
async function remove(col,id){
  try{await db.collection(col).doc(id).delete();return true}
  catch(e){toast("Delete failed: "+(e&&(e.message||e.code)||e),"err");return false}
}

function viewOrders(){
  const end=addDays(todayISO(),ui.orderDays);
  const jobs=S.jobs.filter(j=>j.status==="booked"&&j.date<=end).sort(byDateAsc);
  const pending=jobs.filter(j=>!j.materialsOrdered);
  const agg=aggregate(pending);
  const bySup={}; for(const m of agg){(bySup[m.supplier]=bySup[m.supplier]||[]).push(m)}
  return `<h1 class="pg">Orders</h1><div class="sub">Service materials needed for booked jobs, worked out from each system's units</div>
  <div class="seg">${[7,14,30,60].map(d=>`<button class="${ui.orderDays===d?"on":""}" onclick="ui.orderDays=${d};render()">Next ${d} days</button>`).join("")}</div>
  <div class="card"><h2>To order <span class="pill">${pending.length} job${pending.length===1?"":"s"}</span><span class="sp"></span>${agg.length?`<button class="btn sm" onclick="copyOrder()">Copy order</button><button class="btn sm" onclick="downloadOrder()">CSV</button>`:""}</h2>
  ${agg.length?Object.entries(bySup).map(([sup,items])=>`<div class="sec" style="border:0;margin-top:6px;padding-top:0">${esc(sup)}</div><table class="t"><thead><tr><th>Item</th><th>Code</th><th class="n">Qty</th><th class="n">Est. cost</th></tr></thead><tbody>${items.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.sku)}</td><td class="n">${m.qty}</td><td class="n">${money(m.qty*m.cost)}</td></tr>`).join("")}</tbody></table>`).join("")+`<div class="tot">Estimated total <b>${money(agg.reduce((t,m)=>t+m.qty*m.cost,0))}</b> + VAT</div><div class="actions"><button class="btn pri" onclick="markAllOrdered()">Mark these ${pending.length} jobs as ordered</button></div>`:'<div class="empty">Nothing to order for jobs in this window.</div>'}
  </div>
  <div class="card"><h2>Jobs in window</h2><div class="list">${jobs.length?jobs.map(jobItem).join(""):'<div class="empty">No booked jobs.</div>'}</div></div>`;
}
function aggregate(jobs){
  const m={};
  for(const j of jobs)for(const x of jobMaterials(j)){const k=x.id||x.name;if(!m[k])m[k]={...x,raw:0};m[k].raw+=x.raw}
  return Object.values(m).map(x=>({...x,qty:Math.ceil(x.raw-1e-9)})).sort((a,b)=>a.supplier.localeCompare(b.supplier)||a.name.localeCompare(b.name));
}
function pendingAgg(){const end=addDays(todayISO(),ui.orderDays);return aggregate(S.jobs.filter(j=>j.status==="booked"&&j.date<=end&&!j.materialsOrdered))}
function copyOrder(){const a=pendingAgg();const by={};for(const m of a)(by[m.supplier]=by[m.supplier]||[]).push(m);copyText(Object.entries(by).map(([s,items])=>s+"\n"+items.map(m=>`${m.qty} x ${m.name}${m.sku?" ("+m.sku+")":""}`).join("\n")).join("\n\n"))}
function downloadOrder(){const a=pendingAgg();saveFile("altitude-climate-order-"+todayISO()+".csv",toCSV([["Supplier","Item","Code","Qty","Unit cost","Line cost"],...a.map(m=>[m.supplier,m.name,m.sku,m.qty,m.cost.toFixed(2),(m.qty*m.cost).toFixed(2)])]))}
async function markAllOrdered(){const end=addDays(todayISO(),ui.orderDays);for(const j of S.jobs.filter(j=>j.status==="booked"&&j.date<=end&&!j.materialsOrdered)){const d=clone(j);d.materialsOrdered=true;d.materialsSnapshot=materialsFor(j);await put("jobs",j.id,d)}toast("Marked as ordered")}
async function toggleOrdered(id){const j=clone(job(id));j.materialsOrdered=!j.materialsOrdered;j.materialsSnapshot=j.materialsOrdered?materialsFor(j):null;if(await put("jobs",id,j))toast(j.materialsOrdered?"Parts marked as ordered":"Parts marked as not ordered")}

function invTotals(inv){const net=r2((inv.lines||[]).reduce((t,l)=>t+r2((Number(l.qty)||0)*(Number(l.unit)||0)),0));const vat=inv.vat?r2(net*0.2):0;return{net,vat,gross:r2(net+vat)}}
function invItem(i){const c=client(i.clientId)||{};const t=invTotals(i);return `<div class="item click" onclick="location.hash='i-${i.id}'"><div class="main"><div class="t">${esc(i.number)} · ${esc(c.name||"—")}</div><div class="m">${fmtDate(i.date)} · ${esc(i.reference||"")}</div></div><div style="text-align:right"><div style="font-weight:600">${money(t.gross)}</div>${i.status==="exported"?'<span class="pill green">In Xero</span>':'<span class="pill amber">Draft</span>'}</div></div>`}
function viewInvoices(){

  <div class="seg">${[["draft","Not in Xero"],["exported","In Xero"],["all","All"]].map(([k,l])=>`<button class="${v===k?"on":""}" onclick="ui.invView='${k}';render()">${l}</button>`).join("")}</div>

/* ================= forms & modals ================= */
function formHTML(fields,v){
  let h='<div class="fg">';
  for(const f of fields){
    if(f.sec){h+=`<div class="full sec">${esc(f.sec)}</div>`;continue}
    const id="f_"+f.k; const val=v[f.k]??f.def??""; const cls="f"+(f.full?" full":"")+(f.type==="checkbox"?" cb":"");
    let inp;
    if(f.type==="select"){const opts=typeof f.options==="function"?f.options():f.options;inp=`<select id="${id}">${opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?"selected":""}>${esc(ol)}</option>`}).join("")}</select>`}
    else if(f.type==="textarea") inp=`<textarea id="${id}">${esc(val)}</textarea>`;
    else if(f.type==="checkbox") inp=`<label><input type="checkbox" id="${id}" ${val?"checked":""}> ${esc(f.label)}</label>`;
    else inp=`<input id="${id}" type="${f.type||"text"}" ${f.type==="number"?'step="any" inputmode="decimal"':""} value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
    h+=`<div class="${cls}">${f.type==="checkbox"?"":`<label for="${id}">${esc(f.label)}${f.req?" *":""}</label>`}${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
  }
  return h+"</div>";
}
function readForm(root,fields){
  const o={};
  for(const f of fields){if(f.sec)continue;const el=root.querySelector("#f_"+f.k);if(!el)continue;
    if(f.type==="checkbox")o[f.k]=el.checked;else if(f.type==="number")o[f.k]=el.value===""?"":Number(el.value);else o[f.k]=el.value.trim()}
  return o;
}
function missing(fields,v){const m=fields.filter(f=>f.req&&(v[f.k]===""||v[f.k]==null));if(m.length){toast("Please fill in: "+m.map(f=>f.label).join(", "),"err");return true}return false}
function openModal(title,body,onMount){
  const root=$("#modal-root");
  root.innerHTML=`<div class="ov"><div class="md" role="dialog"><h3>${esc(title)}<button class="x" onclick="closeModal()" aria-label="Close">×</button></h3>${body}</div></div>`;
  const ov=$(".ov",root); ov.addEventListener("click",e=>{if(e.target===ov)closeModal()});
  const md=$(".md",root); if(onMount)onMount(md); return md;
}
function closeModal(){$("#modal-root").innerHTML=""}
function confirmBox(msg,yes="Delete"){return new Promise(res=>{openModal("Are you sure?",`<p>${esc(msg)}</p><div class="actions"><button class="btn" id="cbNo">Keep</button><button class="btn danger" id="cbYes">${esc(yes)}</button></div>`,md=>{$("#cbNo",md).onclick=()=>{closeModal();res(false)};$("#cbYes",md).onclick=()=>{closeModal();res(true)}})})}

function bookJob(sid,jobId){
  const st=set(); const existing=jobId?clone(job(jobId)):null;
  sid=sid||(existing&&existing.systemId)||"";
  const s=sid?system(sid):null; const nInd=s?unitsOf(sid).filter(u=>u.role==="indoor").length:1;
  const j=existing||{systemId:sid,type:s&&!jobsOf(sid).some(x=>x.status==="completed")&&(!s.installDate||s.installDate>=addDays(todayISO(),-14))?"Installation":"Annual service",date:addDays(todayISO(),7),time:"09:00",durationHrs:Math.max(1,0.5+0.5*nInd),engineer:st.engineer,status:"booked"};
  const F=[
    {k:"systemId",label:"System",type:"select",req:true,full:true,options:()=>[["","Choose system…"],...S.systems.filter(x=>!x.inactive).map(x=>[x.id,(client(x.clientId)?.name||"—")+" · "+x.name]).sort((a,b)=>a[1].localeCompare(b[1]))]},
    {k:"type",label:"Job type",type:"select",options:JOB_TYPES},{k:"engineer",label:"Engineer"},

function invoiceLines(j){
  const st=set(); const s=system(j.systemId)||{}; const c=client(s.clientId)||{}; const us=unitsOf(s.id);
  const nInd=Math.max(1,us.filter(u=>u.role==="indoor").length); const L=[]; const site=siteShort(s);
  const plan=c.servicePlan==="Annual service plan"&&c.planPrice;
  if(SERVICE_TYPES.includes(j.type)){
    if(plan) L.push({desc:`Annual air conditioning service (service plan) – ${s.name}, ${site} – ${nInd} indoor unit${nInd>1?"s":""}`,qty:1,unit:Number(c.planPrice)});
    else{L.push({desc:`Annual air conditioning service – ${s.name}, ${site} (first indoor unit + outdoor)`,qty:1,unit:Number(st.labourFirst)});
      if(nInd>1)L.push({desc:"Additional indoor unit serviced",qty:nInd-1,unit:Number(st.labourAdditional)})}
    if(j.type==="Service + repair"&&j.durationHrs)L.push({desc:"Repair labour",qty:1,unit:Number(st.labourHourly)});
  }else if(j.type==="Leak check"){L.push({desc:`F-gas leak check – ${s.name}, ${site}`,qty:1,unit:Number(st.leakCheckCharge)})}
  else if(j.type==="Repair / breakdown"){L.push({desc:`Call-out – ${s.name}, ${site}`,qty:1,unit:Number(st.calloutCharge)});const h=Math.max(0,(Number(j.durationHrs)||1)-1);if(h)L.push({desc:"Additional labour (hours)",qty:h,unit:Number(st.labourHourly)})}
  else if(isInstall(j)&&Number(j.quote)) L.push({desc:j.type==="Installation"?`Supply and installation of air conditioning – ${s.name}, ${site} (${unitsSummary(s.id)})`:`Commissioning – ${s.name}, ${site}`,qty:1,unit:Number(j.quote)});
  else L.push({desc:`${j.type} – ${s.name}, ${site}`,qty:Number(j.durationHrs)||1,unit:Number(st.labourHourly)});
  const info=sysInfo(s);
  if(SERVICE_TYPES.includes(j.type)&&info.f.required&&j.leakCheck&&j.leakCheck.performed)L.push({desc:`Mandatory F-gas leak check (${num(info.f.t)} t CO₂e)`,qty:1,unit:Number(st.leakCheckCharge)});
  if(j.leakCheck&&j.leakCheck.addedKg)L.push({desc:`${s.refrigerant||"Refrigerant"} top-up (kg)`,qty:Number(j.leakCheck.addedKg),unit:Number(st.refrigerantPerKg)});
  for(const m of (j.materialsUsed||materialsFor(j)))if(m.chargeable&&m.qty)L.push({desc:m.name,qty:m.qty,unit:m.sell});
  return L.map(l=>({...l,unit:r2(l.unit)}));
}

const photoWait={};
function phPlaceholder(id){return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"><!--'+id+'--><rect width="1" height="1" fill="#eef1f4"/></svg>')}
function photoSrc(id){
  if(photoCache[id])return photoCache[id];
  if(sb&&!photoWait[id]){photoWait[id]=sb.storage.from("photos").createSignedUrl(id,3600).then(({data})=>{
    if(!data)return;const ph=phPlaceholder(id);photoCache[id]=data.signedUrl;
    for(const el of document.querySelectorAll("img"))if(el.getAttribute("src")===ph)el.src=data.signedUrl;
    for(const el of document.querySelectorAll("a[href]"))if(el.getAttribute("href")===ph)el.href=data.signedUrl;
  })}
  return phPlaceholder(id);
}
async function compressImage(file){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.82));
}
async function uploadPhoto(file){
  let blob=file; try{blob=await compressImage(file)}catch(e){}
  const type=["image/jpeg","image/png","image/webp","image/gif"].includes(blob.type)?blob.type:"image/jpeg";
  const res=await assets.upload(blob,{type}); photoCache[res.id]=res.url; return res.id;
}

async function decodePhoto(f){
  if(typeof window.jsQR!=="function") throw new Error("QR reader didn't load – type the ID instead");
  const bmp=await createImageBitmap(f);
  for(const max of [1200,800,1800]){
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)); const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.drawImage(bmp,0,0,w,h);
    const code=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"attemptBoth"}); if(code) return code.data;
  }
  return null;
}

function icsFold(line){const out=[];while(line.length>73){out.push(line.slice(0,73));line=" "+line.slice(73)}out.push(line);return out.join("\r\n")}

  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Altitude Climate//Asset Manager//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Altitude Climate jobs",

  for(const j of jobs){
    const s=system(j.systemId)||{}; const c=client(s.clientId)||{}; const us=unitsOf(s.id); const mats=jobMaterials(j);
    const start=icsDT(j.date,j.time||"09:00"); const mins=Math.round((Number(j.durationHrs)||1)*60);
    const [h,m]=(j.time||"09:00").split(":").map(Number); const endM=h*60+m+mins; const end=icsDT(j.date,String(Math.min(23,Math.floor(endM/60))).padStart(2,"0")+":"+String(endM>=24*60?59:endM%60).padStart(2,"0"));
    const desc=[`${j.type} – ${s.name}`,`Client: ${c.name||""}`,`Contact: ${c.contactName||""} ${c.phone||""}`.trim(),s.accessNotes?"Access: "+s.accessNotes:"","",
      "Units:",...us.map(u=>`• ${u.id} ${unitLabel(u)} ${u.manufacturer||""} ${u.model||""}${u.location?" ("+u.location+")":""}`),"",
      mats.length?"Materials:":"",...mats.map(x=>`• ${x.qty} x ${x.name}`),j.notes?"\nNotes: "+j.notes:"",st.appUrl?"\nOpen job: "+appUrl()+"#j-"+j.id:""].filter(x=>x!=null).join("\n");
    L.push("BEGIN:VEVENT","UID:"+j.id+"@altitude-climate","DTSTAMP:"+stamp,"DTSTART;TZID=Europe/London:"+start,"DTEND;TZID=Europe/London:"+end,
      icsFold("SUMMARY:"+icsEsc(`${j.type} – ${c.name||""} (${s.sitePostcode||siteShort(s)})`)),
      icsFold("LOCATION:"+icsEsc([s.siteAddress,s.sitePostcode].filter(Boolean).join(", ").replace(/\n/g,", "))),
      icsFold("DESCRIPTION:"+icsEsc(desc)),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(j.type),"TRIGGER:-P1D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(j.type),"TRIGGER:-PT1H","END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR"); return L.join("\r\n")+"\r\n";
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipFiles(files){
  const enc=new TextEncoder(); const parts=[]; const cen=[]; let off=0;
  const d=new Date(); const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF; const dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name); off+=30+name.length+data.length;
  }
  const cenSize=cen.reduce((t,a)=>t+a.length,0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cenSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/zip"});
}
async function exportCalendar(ids){
  const jobs=ids?ids.map(job).filter(Boolean):S.jobs.filter(j=>j.status==="booked"&&j.date>=todayISO()).sort(byDateAsc);
  if(!jobs.length){toast("No upcoming bookings to export");return}
  const name=jobs.length===1?("job-"+jobs[0].date):"altitude-climate-bookings";
  const ok=await saveFile(name+".zip",zipFiles([{name:name+".ics",data:buildICS(jobs)}]));
  if(ok) openModal("Add to iCloud Calendar",`<p>The calendar file is saved as a zip.</p><ol style="padding-left:20px;line-height:1.6"><li>On your iPhone, open it in <b>Files</b> – tap the zip to unpack it.</li><li>Tap the <b>.ics</b> file, then <b>Add All</b> and choose your iCloud calendar.</li></ol><p class="note">On a Mac, double-click the .ics to add it to Calendar. Re-exporting the same job updates it rather than duplicating it.</p><div class="actions"><button class="btn pri" onclick="closeModal()">Done</button></div>`);
}

/* ================= exports ================= */
async function exportFgas(){
  const rows=[["Client","System","Site","Postcode","Install date","Refrigerant","GWP","Charge kg","t CO2e","Hermetic","Leak detection","Leak check every (months)","Last leak check","Next leak check","Ref added to date kg","Ref recovered to date kg","Units"]];
  for(const s of S.systems){const c=client(s.clientId)||{};const i=sysInfo(s);const done=i.done;
    rows.push([c.name,s.name,(s.siteAddress||"").replace(/\n/g,", "),s.sitePostcode,s.installDate,s.refrigerant,i.f.gwp,i.f.kg.toFixed(3),i.f.t.toFixed(3),s.hermetic?"Yes":"No",s.leakDetection?"Yes":"No",i.f.months||"Not required",i.lastLeak||"",i.nextLeak||"",done.reduce((t,j)=>t+(j.leakCheck?.addedKg||0),0).toFixed(3),done.reduce((t,j)=>t+(j.leakCheck?.recoveredKg||0),0).toFixed(3),unitsOf(s.id).map(u=>u.id+" "+(u.model||"")+" "+(u.serial||"")).join("; ")])}
  await saveFile("fgas-register-"+todayISO()+".csv",toCSV(rows));
}
async function backup(){await saveFile("altitude-climate-backup-"+todayISO()+".json",JSON.stringify({exported:new Date().toISOString(),...S},null,2))}

/* ================= scanning ================= */
$("#scanBtn").onclick=()=>openModal("Scan a unit",`<p style="margin-top:0">Take a photo of the QR label and the unit opens.</p>
  <div class="actions" style="justify-content:stretch"><button class="btn pri" style="flex:1;justify-content:center;padding:14px" id="takePic">📷 Take photo of QR code</button></div>
  <div class="sec">Or type the ID</div><div class="row"><input class="search" style="margin:0;flex:1" id="manId" placeholder="AC-XXXXX" autocapitalize="characters"><button class="btn" id="manGo">Open</button></div>
  <p class="note">Tip: your phone's own camera app works too – point it at a label and tap the link.</p>`,md=>{
  $("#takePic",md).onclick=()=>$("#scanFile").click();
  const go=()=>{const id=parseScan($("#manId",md).value)||$("#manId",md).value.trim().toUpperCase();if(unit(id)||STICKER_RE.test(id)){closeModal();location.hash="u-"+id}else toast("That isn't a valid asset ID","err")};
  $("#manGo",md).onclick=go; $("#manId",md).onkeydown=e=>{if(e.key==="Enter")go()};
});
$("#scanFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; const mode=scanMode; scanMode=null; if(!f) return;
  toast("Reading QR code…");
  let data=null;
  try{data=await decodePhoto(f)}catch(err){toast(err.message||"Couldn't read that photo","err");return}
  if(!data){toast("Couldn't find a QR code – try again closer and in focus","err");return}
  const id=parseScan(data);
  if(!id||!STICKER_RE.test(id)){toast("That QR code isn't an Altitude Climate sticker","err");return}
  closeModal();
  if(mode&&mode.add){
    if(unit(id)){const s=system(unit(id).systemId);toast(id+" is already registered"+(s?" to "+s.name:""),"err");return}
    editUnit(null,mode.add,null,id); return;
  }
  location.hash="u-"+id; toast(unit(id)?"Opened "+id:"New sticker "+id+" – add it to an install");
};

/* ================= boot ================= */
(async()=>{
  let realDb=null;
  const cfg=window.APP_CONFIG||{};
  downloads=sbDownloads;
  if(cfg.supabaseUrl&&cfg.supabaseAnonKey&&window.supabase){
    sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data:{session}}=await sb.auth.getSession();
    if(!session){loginScreen();return}
    realDb=sbDb();
    try{await realDb.load()}catch(e){loginScreen("Couldn't load your data: "+(e.message||e));return}
    assets=sbAssets;
  }
  if(realDb){db=realDb}else{db=memDb();memoryMode=true}
  const onErr=e=>toast("Sync problem: "+(e&&(e.message||e.code)),"err");
  for(const c of COLS) db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));loaded.add(c);schedule()},onErr);
  db.doc("config/settings").onSnapshot(snap=>{S.settings=snap.exists?Object.assign({},snap.data()):{};loaded.add("settings");schedule()},onErr);
})();
